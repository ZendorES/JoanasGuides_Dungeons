# 1. NOMBRE DEL PROCESO
name: Publicar Addon Release

# 2. DISPARADOR (¿Cuándo se ejecuta esto?)
on:
  release:
    types: [published]

# 3. LAS TAREAS (Jobs)
jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      # Descarga el código de tu repositorio en el servidor de GitHub
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # =========================================================================
      # 4. COMPRIMIR AMBAS CARPETAS EN UN ÚNICO ZIP
      # =========================================================================
      # Tarjeta de empaquetado unificado
      - name: Paquetizar Addons en un único archivo
        id: pack_addons
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NOMBRE_ZIP="JoanasGuides-${TAG}.zip"
          zip -r "$NOMBRE_ZIP" JoanasGuides JoanasGuides-Era
          echo "zip_name=$NOMBRE_ZIP" >> $GITHUB_OUTPUT

      # =========================================================================
      # 5. SUBIR EL ASSET ÚNICO A LA RELEASE DE GITHUB
      # =========================================================================
      - name: Subir Asset a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.pack_addons.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 6. NOTIFICACIÓN A DISCORD (Zendor)
      # =========================================================================
      - name: Notificar Nueva Release en Discord (Zendor)
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}

      # =========================================================================
      # 7. NOTIFICACIÓN A DISCORD (Damned)
      # =========================================================================
      - name: Notificar Nueva Release en Discord (Damned)
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_DAMNED_WEBHOOK }}
